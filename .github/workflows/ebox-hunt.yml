# Treasure Hunt ("free hunt") — sesi buka 10 menit sekali sehari:
# V2 (Level 2+) buka 05:00 UTC = 12:00 WIB, diundi 12:10 WIB.
#
# Kenapa tidak sekadar "cron tepat jam 12:00"? Cron GitHub (dan penerusnya)
# sering telat puluhan detik sampai beberapa menit, sedangkan jendelanya 10
# menit. Jadi pola yang dipakai di sini SAMA seperti boxkia-bot:
#
#   dipanggil tiap menit  →  job mengecek sesi berikutnya
#     • masih jauh (>2 menit)   : langsung keluar, murah
#     • ≤2 menit lagi           : tidur memakai jam SERVER sampai detik buka,
#                                 tembak 0,5 detik sebelum buka; kalau server
#                                 bilang "belum buka", ulangi tiap 0,7 detik
#
# Hasilnya: telat 1-2 menit pun tetap ikut, karena job-nya menunggu — bukan
# menembak sekali lalu menyerah.
#
# Pemicu utama: repository_dispatch 'tick' dari cron-job.org tiap menit
# (lihat ACTIONS.md). Cron */5 di bawah ini cuma cadangan.
name: ebox-hunt

on:
  repository_dispatch:
    types: [tick, hunt]
  schedule:
    - cron: '*/5 * * * *'
    # Jaring pengaman khusus jendela buka: 04:58–04:59 dan 05:00–05:09 UTC
    # (11:58–12:09 WIB). Cron GitHub tetap bisa telat, jadi ini bukan pengganti
    # pemicu tiap menit — cuma menambah percobaan di menit-menit penting.
    - cron: '58,59 4 * * *'
    - cron: '0-9 5 * * *'
  workflow_dispatch:

concurrency:
  group: ebox-hunt
  cancel-in-progress: false

jobs:
  join:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Tanpa ini, tiap run mulai dari state kosong → notif "gagal menetap"
      # (mis. sesi mati) terkirim lagi tiap menit, bukan tiap 6 jam.
      - name: Pulihkan state notifikasi
        uses: actions/cache@v4
        with:
          path: ebox-notify-state.json
          key: ebox-hunt-state-${{ github.run_id }}
          restore-keys: ebox-hunt-state-

      - name: Tulis config.json dari Secrets
        env:
          EBOX_CONFIG: ${{ secrets.EBOX_CONFIG }}
        run: |
          if [ -z "$EBOX_CONFIG" ]; then
            echo "::error::Secret EBOX_CONFIG kosong. Lihat ACTIONS.md."
            exit 1
          fi
          printf '%s' "$EBOX_CONFIG" > config.json

      - name: Ikut Treasure Hunt (tunggu jam buka)
        env:
          # Mulai menunggu kalau buka tinggal ≤90 detik; tembak 1,2 detik lebih
          # awal supaya request mendarat tepat saat sesi terbuka.
          EBOX_HUNT_ARM_MS: '120000'
          EBOX_HUNT_LEAD_MS: '500'
          EBOX_HUNT_RETRY_MS: '700'
        run: node ebox-daily.mjs --await
